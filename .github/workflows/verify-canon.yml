name: verify-canon-integration
on:
  push:
    branches: [main, feature/canon-four-labs]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run sync:knowledge
      - run: npm run test:canon
      - name: API handler integration tests (no Cloudflare credentials)
        run: npm run test:api
